  <style>
    .cn-boot-loading {
      display: flex;
      min-height: 40vh;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #16241F;
      font: 500 14px system-ui, sans-serif;
    }
    .cn-boot-loading::before {
      width: 18px;
      height: 18px;
      border: 2px solid #DAD5C6;
      border-top-color: #0F6E56;
      border-radius: 50%;
      content: "";
      animation: cn-boot-spin 700ms linear infinite;
    }
    @keyframes cn-boot-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <cn-app-shell id="app">
    <div class="cn-boot-loading" role="status" aria-label="Loading Bika">Loading Bika</div>
  </cn-app-shell>
  <script type="module" src="./src/main.js"></script>
</body>

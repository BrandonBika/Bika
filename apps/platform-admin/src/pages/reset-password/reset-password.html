<main class="frontdoor">
  <div class="frontdoor-shell">
    <section class="frontdoor-brand" aria-label="CivicNeuro">
      <div>
        <div class="brand-mark"><span class="mark" aria-hidden="true">C</span>CivicNeuro</div>
        <h1>Choose a new password.</h1>
        <p>Use a new password to regain secure access to the platform.</p>
      </div>
      <div class="frontdoor-meta">Platform staff account recovery</div>
    </section>
    <section class="frontdoor-card">
      <h2>Reset password</h2>
      <p class="lead">Create a new password for your account.</p>
      <div class="form-message" role="status" aria-live="polite" hidden></div>
      <form class="auth-form">
        <div class="fd-field">
          <label for="new-password">New password</label>
          <input class="fd-input" id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="fd-field">
          <label for="confirm-password">Confirm new password</label>
          <input class="fd-input" id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="fd-actions">
          <button class="fd-btn primary" type="submit">Reset password</button>
          <a class="fd-btn ghost" href="#/login">Back to sign in</a>
        </div>
      </form>
    </section>
  </div>
</main>
